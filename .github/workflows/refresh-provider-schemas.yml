name: Refresh provider schemas

on:
  schedule:
    # First of every month at 09:00 UTC.
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Refresh schemas
        run: npm run refresh-schemas

      - name: Verify build still works
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Open PR if schemas changed
        id: create-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-provider-schemas
          title: "chore: refresh Postiz provider schemas"
          commit-message: "chore: refresh Postiz provider schemas"
          body: |
            Monthly refresh from `docs.postiz.com/public-api/providers/*.md`.

            If providers were added/removed, update `scripts/fetch-provider-schemas.ts` `PROVIDERS` accordingly.
          add-paths: |
            src/providers/schemas.ts

      - name: Report PR creation warning
        if: steps.create-pr.outcome == 'failure'
        run: |
          echo "::warning::Schema refresh passed and the update branch was pushed, but GitHub repo policy blocked automatic PR creation."
          echo "::warning::Open the PR manually from branch chore/refresh-provider-schemas."
